name: Stabilization
on:
  pull_request:
  push:
    branches: [main, 'stabilization/**']
permissions:
  contents: read
concurrency:
  group: stabilization-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend --include=dev
      - run: npm ci --prefix frontend --include=dev
      - run: npm run typecheck --prefix backend
      - run: npm run typecheck --prefix frontend
      - run: npm run test:integration --prefix backend
      - run: node backend/scripts/test-deployment.mjs
      - run: npm run test:frontend-lib --prefix backend
      - run: npm run build --prefix frontend
  dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm audit --prefix ${{ matrix.workspace }} --omit=dev --audit-level=high
