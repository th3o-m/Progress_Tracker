name: Stabilization
on:
  pull_request:
  push:
    branches: [main, 'stabilization/**']
permissions:
  contents: read
concurrency:
  group: stabilization-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend --include=dev
      - run: npm ci --prefix frontend --include=dev
      - run: npm run typecheck --prefix backend
      - run: npm run typecheck --prefix frontend
      - run: npm run test:integration --prefix backend
      - run: node backend/scripts/test-deployment.mjs
      - run: npm run test:frontend-lib --prefix backend
      - run: npm run build --prefix frontend
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm audit --prefix ${{ matrix.workspace }} --omit=dev --audit-level=high
